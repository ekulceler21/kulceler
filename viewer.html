<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Model Görüntüleyici</title>
    <!-- Google Model Viewer bileşeni -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #08090b;
            font-family: sans-serif;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #08090b;
        }
        .info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #b7c0ca;
            background: rgba(21, 25, 31, 0.8);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid #303740;
            pointer-events: none;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <!-- 
      Model Viewer Kullanımı:
      - src: 3D model dosya yolu (GLB/GLTF)
      - camera-controls: Fare ile döndürme (orbit) özelliğini aktif eder
      - disable-zoom: Tekerlek veya dokunmatik hareketlerle yakınlaşma/uzaklaşmayı (zoom) tamamen engeller
      - auto-rotate: İsteğe bağlı otomatik döndürme (isterseniz silebilirsiniz)
    -->
    <model-viewer 
        src="279d823b6a7dbcb051adf2e92f1af31d.glb" 
        alt="3D Model" 
        camera-controls 
        disable-zoom
        touch-action="pan-y"
        shadow-intensity="1"
        exposure="1">
    </model-viewer>

    <div class="info">Modeli döndürmek için tıklayıp sürükleyin (Zoom kapalıdır)</div>

</body>
</html>
